; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env_default]
platform = espressif32 
board = esp32dev
framework = arduino


; Board-specific configurations
board_upload.flash_size = 16MB     ; Set flash memory size to 16MB
board_build.f_cpu = 240000000L     ; Set CPU frequency to 240MHz
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_build.events_core = 1
board_build.arduino_core = 1
board_build.erase_flash = true

board_build.partitions = huge_app.csv   ; Allow bigger app size for BLE + WiFiProv

; Set build type to "release" for optimized code
build_type = release

; Serial monitor and upload speeds
monitor_speed = 115200       ; Set serial monitor baud rate
upload_speed = 921600        ; Set upload baud rate for faster flashing
upload_port = 

; Compiler optimization and board-specific flags
build_flags = 
    -I include
    -DBOARD_HAS_PSRAM  ; Define macro to enable PSRAM support

[env:Connect]
extends= env_default
build_src_filter=+<Connect>
; Optional: helps with BLE and WiFi provisioning examples

